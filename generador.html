<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Invitaciones | Estefan&iacute;a &amp; Camilo</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  body{
    font-family:'Cormorant Garamond', serif; background:#e4e5e0; margin:0;
    display:flex; justify-content:center; padding:30px 14px; color:#3a3a38;
  }
  .box{
    max-width:600px; width:100%; background:#f7f7f4; border:1px solid rgba(217,163,176,.6);
    border-radius:8px; padding:30px; box-shadow:0 10px 30px rgba(50,50,45,.15);
  }
  h1{ font-family:'Playfair Display', serif; text-align:center; font-size:26px; color:#a8677a; margin-top:0; }
  label{ display:block; font-weight:600; margin:16px 0 6px; }
  input, textarea{
    width:100%; padding:10px; font-size:17px; font-family:inherit;
    border:1px solid rgba(107,118,84,.5); border-radius:6px; box-sizing:border-box;
  }
  small{ color:#6b6b64; }
  button{
    margin-top:18px; width:100%; padding:12px; background:linear-gradient(135deg,#6b7654,#4a5236);
    color:#fff; border:none; border-radius:24px; font-size:18px; cursor:pointer; font-family:'Playfair Display', serif;
  }
  .result{ margin-top:20px; }
  .result input{ background:#fff; }
  .copy-row{ display:flex; gap:8px; margin-top:8px; }
  .copy-row button{ width:auto; padding:8px 14px; font-size:15px; margin:0; }
  a.share{
    display:inline-block; margin-top:10px; text-decoration:none; color:#a8677a; font-weight:600;
  }
</style>
</head>
<body>
<div class="box">
  <h1>Generador de invitaciones por familia</h1>
  <p><small>Este archivo es solo una herramienta para ustedes dos. No se la env&iacute;en a los invitados.</small></p>

  <label for="grupo">Nombre del grupo familiar</label>
  <input id="grupo" placeholder="Ej: Familia &Aacute;lvarez">

  <label for="invitados">Nombres de los invitados de ese grupo (separados por coma)</label>
  <textarea id="invitados" rows="3" placeholder="Ej: Henry &Aacute;lvarez, Julieta P&eacute;rez"></textarea>

  <label for="baseUrl">URL donde publicaron index.html</label>
  <input id="baseUrl" placeholder="Ej: https://tu-usuario.github.io/invitaciones/index.html">
  <small>Si a&uacute;n no la publican en internet, dejen este campo as&iacute; como est&eacute; de ejemplo y actual&iacute;cenlo despu&eacute;s.</small>

  <button onclick="generar()">Generar enlace</button>

  <div class="result" id="resultado" style="display:none">
    <label>Enlace personalizado</label>
    <input id="linkGenerado" readonly>
    <div class="copy-row">
      <button onclick="copiar()">Copiar enlace</button>
      <a class="share" id="waShare" target="_blank">Enviar por WhatsApp &rarr;</a>
    </div>
  </div>
</div>

<script>
function generar(){
  const grupo = document.getElementById('grupo').value.trim();
  const invitados = document.getElementById('invitados').value.trim();
  const base = document.getElementById('baseUrl').value.trim() || 'index.html';

  if(!grupo || !invitados){
    alert('Completa el nombre del grupo y los invitados.');
    return;
  }

  const params = new URLSearchParams();
  params.set('grupo', grupo);
  params.set('invitados', invitados);

  const link = `${base}?${params.toString()}`;
  document.getElementById('linkGenerado').value = link;
  document.getElementById('resultado').style.display = 'block';

  const texto = `\u00a1Hola ${grupo}! Con mucha alegr\u00eda los invitamos a nuestra boda \uD83D\uDC8D. Por favor confirmen su asistencia aqu\u00ed: ${link}`;
  document.getElementById('waShare').href = `https://wa.me/?text=${encodeURIComponent(texto)}`;
}

function copiar(){
  const input = document.getElementById('linkGenerado');
  input.select();
  document.execCommand('copy');
}
</script>
</body>
</html>
